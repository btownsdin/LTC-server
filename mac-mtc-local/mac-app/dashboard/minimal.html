<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timecode</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0c0c0e;
            user-select: none;
        }
        #clockSvg { display: block; width: 100vw; height: 100vh; }
        #clockText {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            fill: #6b7280;                 /* paused = gray (base state) */
            transition: fill 0.15s ease;
        }
        #clockText.state-run { fill: #10b981; }
        #clockText.state-y   { fill: #eab308; }
        #clockText.state-o   { fill: #f97316; }
        #clockText.state-r   { fill: #ef4444; }
    </style>
</head>
<body>
    <!-- Fixed viewBox stretched to the whole viewport (preserveAspectRatio=none).
         textLength + lengthAdjust force the digits to a fixed width (92 of 100),
         so the clock always fills the screen with a small even margin and can
         never clip — no JS measurement involved. -->
    <svg id="clockSvg" viewBox="0 0 100 52" preserveAspectRatio="none">
        <text id="clockText" x="50" y="26"
              text-anchor="middle" dominant-baseline="central"
              textLength="92" lengthAdjust="spacingAndGlyphs"
              font-size="62">00:00</text>
    </svg>

    <script>
        const clockText = document.getElementById('clockText');

        let pieces = new Array(8).fill(0);
        let sequenceMask = 0;
        let lastQuarterFrameTime = 0;
        let mtcTimeout = null;

        let lastDispH = -1, lastDispM = -1, lastDispS = -1;
        let lastMovementTime = 0;
        const LOOSE_TOLERANCE_MS = 2000;

        const socket = new WebSocket(`ws://${window.location.host}`);

        socket.onclose = () => {
            clockText.setAttribute('class', '');
            clearTimeout(mtcTimeout);
        };

        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.bytes) {
                const actualBytes = Array.isArray(msg.bytes) ? msg.bytes : msg.bytes.data;
                if (actualBytes) handleMIDIMessage(actualBytes);
            }
        };

        function handleMIDIMessage(data) {
            if (!data || data.length === 0) return;

            if (data[0] === 0xF1 && data.length >= 2) {
                const value = data[1];
                const pieceIndex = (value >> 4) & 0x07;
                const nibble = value & 0x0F;

                pieces[pieceIndex] = nibble;
                sequenceMask |= (1 << pieceIndex);
                lastQuarterFrameTime = Date.now();

                if (sequenceMask === 0xFF) {
                    const seconds = pieces[2] | (pieces[3] << 4);
                    const minutes = pieces[4] | (pieces[5] << 4);
                    const hours = pieces[6] | ((pieces[7] & 0x01) << 4);
                    updateDisplay(hours, minutes, seconds);
                    sequenceMask = 0;
                }
            }
            else if (data[0] === 0xF0 && data[1] === 0x7F && data[3] === 0x01 && data[4] === 0x01 && data.length >= 10) {
                if (Date.now() - lastQuarterFrameTime > 200) {
                    const hours = data[5] & 0x1F;
                    const minutes = data[6];
                    const seconds = data[7];
                    updateDisplay(hours, minutes, seconds);
                }
            }
        }

        function updateDisplay(h, m, s) {
            const now = Date.now();

            const timeDigitsChanged = (h !== lastDispH || m !== lastDispM || s !== lastDispS);
            if (timeDigitsChanged || lastDispH === -1) lastMovementTime = now;

            const isPlaybackActive = (now - lastMovementTime < LOOSE_TOLERANCE_MS);
            const remaining = h * 3600 + m * 60 + s;
            let state;
            if (!isPlaybackActive)      state = '';
            else if (remaining <= 3)    state = 'state-r';
            else if (remaining <= 5)    state = 'state-o';
            else if (remaining <= 10)   state = 'state-y';
            else                        state = 'state-run';
            clockText.setAttribute('class', state);

            lastDispH = h;
            lastDispM = m;
            lastDispS = s;

            const totalMinutes = h * 60 + m;
            const pad = (num) => String(num).padStart(2, '0');
            clockText.textContent = `${pad(totalMinutes)}:${pad(s)}`;

            clearTimeout(mtcTimeout);
            mtcTimeout = setTimeout(() => { clockText.setAttribute('class', ''); }, LOOSE_TOLERANCE_MS);
        }
    </script>
</body>
</html>
